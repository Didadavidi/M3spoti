# Builds and tests every push / pull request and keeps the debug APK as an artifact for 14 days.
# A version tag ("v2.4.0-beta.2", "v2.4.0") also builds the signed APKs and publishes the release.
name: Android

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  # The "Run workflow" button on the Actions tab: a build of any branch without a push.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Unit tests of every module that has them: the Android modules (app, host-android) run
      # testDebugUnitTest, the JVM modules (extensions, api-spotify, host-cdp) run test.
      # The live tests in host-cdp skip themselves without a browser to drive.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :host-android:testDebugUnitTest :extensions:test :api-spotify:test :host-cdp:test

      - name: Test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            base/**/build/reports/tests/
            base/**/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: m3spoti-debug
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the earlier tags, for the tag check and a beta's notes

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Strict semver tags, so the app's update check compares versions right: "v2.4.0-beta.2"
      # (a pre-release, offered to the beta app) or "v2.4.0" (a release). See tools/check_tag.py.
      - name: Tag format
        working-directory: .
        run: python3 tools/check_tag.py "$GITHUB_REF_NAME"

      # M3spoti's one release key, from the repository's secrets (Settings > Secrets and variables >
      # Actions): M3SPOTI_KEYSTORE_BASE64 (the .jks file, base64), M3SPOTI_KEYSTORE_PASSWORD and
      # M3SPOTI_KEY_ALIAS (m3spoti). Keep the key for good: without it installed apps cannot update.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.M3SPOTI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::secret M3SPOTI_KEYSTORE_BASE64 missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Every APK of the release in one build, named by collectApks: M3spoti-Beta-2.4.0-beta.2-ARMv8.apk,
      # -ARMv7 and -universal (the app's update check picks the phone's own, UpdateChecker.apkAsset).
      # updateRepo turns the in-app update check on, against this repository's releases;
      # updateRepoId (its number) keeps it working if the repository is renamed again.
      - name: Release APKs
        env:
          MYSPOTI_KEYSTORE: ${{ runner.temp }}/release.jks
          MYSPOTI_KEYSTORE_PASSWORD: ${{ secrets.M3SPOTI_KEYSTORE_PASSWORD }}
          MYSPOTI_KEY_ALIAS: ${{ secrets.M3SPOTI_KEY_ALIAS }}
          MYSPOTI_KEY_PASSWORD: ${{ secrets.M3SPOTI_KEYSTORE_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease collectApks             -PappVersionName="$VERSION"             -PappVersionCode="$((1000 + GITHUB_RUN_NUMBER))"             -PupdateRepo="$GITHUB_REPOSITORY"             -PupdateRepoId="$GITHUB_REPOSITORY_ID"

      # This version's section of CHANGELOG.md becomes the release description: "## 2.4.0-beta.2",
      # else the version it leads to ("## 2.4.0"), else "## Unreleased ...".
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          section() { awk -v v="$1" 'index($0, "## " v) == 1 {f=1; next} /^## / && f {exit} f' ../CHANGELOG.md; }
          section "$VERSION" > release-notes.md
          [ -s release-notes.md ] || section "${VERSION%%-*}" > release-notes.md
          [ -s release-notes.md ] || section "Unreleased" > release-notes.md
          [ -s release-notes.md ] || echo "See the commits since the previous release." > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          # Not the -TV.apk: the TV design lives on the tv branch (its previews are built from there).
          files: |
            base/app/build/release-apks/M3spoti-*-ARMv8.apk
            base/app/build/release-apks/M3spoti-*-ARMv7.apk
            base/app/build/release-apks/M3spoti-*-universal.apk
          body_path: base/release-notes.md
          generate_release_notes: true
          # "v2.4.0-beta.2": a pre-release, offered only to the beta app.
          prerelease: ${{ contains(github.ref_name, '-') }}
