# Builds and tests every push / pull request and keeps the debug APK as an artifact for 14 days.
# M3spoti has no signed releases of its own yet: Myspoti's release job needed Myspoti's signing keys.
name: Android

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # Unit tests of every module that has them: the Android modules (app, host-android) run
      # testDebugUnitTest, the JVM modules (extensions, api-spotify, host-cdp) run test.
      # The live tests in host-cdp skip themselves without a browser to drive.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :host-android:testDebugUnitTest :extensions:test :api-spotify:test :host-cdp:test

      - name: Test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            base/**/build/reports/tests/
            base/**/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: m3spoti-debug
          path: base/app/build/outputs/apk/debug/*.apk
          retention-days: 14

